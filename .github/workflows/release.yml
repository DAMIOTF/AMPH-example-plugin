name: Release

# Only stable semantic-version tags publish. A prerelease tag such as
# v1.0.0-rc.1 is rejected so `releases/latest` can never point at it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish plugin.json and plugin.wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with the Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install WABT
        run: |
          sudo apt-get update
          sudo apt-get install --yes wabt

      - name: Require a stable tag that matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a stable vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          manifest_version=$(python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          assert manifest["version"] == cargo["package"]["version"]
          print(manifest["version"])
          PY
          )
          if [[ "v${manifest_version}" != "$TAG" ]]; then
            echo "::error::manifest version '$manifest_version' does not match tag '$TAG'"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run parser tests
        run: cargo test --locked --lib

      - name: Build and validate release assets
        run: ./scripts/build-release-assets.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/plugin.json \
            dist/plugin.wasm \
            --title "Example Snapshot Analyzer ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Verify GitHub digests and downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
